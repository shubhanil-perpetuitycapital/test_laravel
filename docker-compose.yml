# =============================================================
# DFC Logistics — app + MySQL
# Coolify: use the "Docker Compose" build pack; fill the variables
#          in the Environment Variables tab (required ones are marked).
# Plain Docker: docker compose --env-file .env.production up -d --build
# =============================================================
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_NAME: "${APP_NAME:-DFC Logistics}"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY:?Set APP_KEY (php artisan key:generate --show)}"
      APP_URL: "${APP_URL:?Set APP_URL, e.g. https://dfclogistics.in}"
      APP_TIMEZONE: Asia/Kolkata
      APP_LOCALE: en
      APP_FAKER_LOCALE: en_IN

      LOG_CHANNEL: stderr
      LOG_LEVEL: "${LOG_LEVEL:-info}"

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE:-dfc_logistics_front}"
      DB_USERNAME: "${DB_USERNAME:-dfc}"
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD}"

      SESSION_DRIVER: file
      SESSION_LIFETIME: "120"
      SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-true}"
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: local
      BROADCAST_CONNECTION: log

      MAIL_MAILER: "${MAIL_MAILER:-log}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-info@dfclogistics.in}"
      MAIL_FROM_NAME: "${APP_NAME:-DFC Logistics}"

      DFC_IMAGE_BASE: "${DFC_IMAGE_BASE:-https://www.dfclogistics.in/images/}"
      DFC_FUEL_PRICE: "${DFC_FUEL_PRICE:-92}"
      ADMIN_NAME: "${ADMIN_NAME:-DFC Admin}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@dfclogistics.in}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set a strong ADMIN_PASSWORD}"

      DFC_API_BASE_URL: "${DFC_API_BASE_URL:-}"
      DFC_API_TENANT_HEADER: "${DFC_API_TENANT_HEADER:-X-Tenant}"
      DFC_API_TENANT: "${DFC_API_TENANT:-}"
      DFC_API_SALT_HEADER: "${DFC_API_SALT_HEADER:-X-Salt-Key}"
      DFC_API_SALT_KEY: "${DFC_API_SALT_KEY:-}"
      DFC_API_TIMEOUT: "${DFC_API_TIMEOUT:-8}"

      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
      SEED_ADMIN: "${SEED_ADMIN:-true}"
    volumes:
      # Uploaded investor PDFs, sessions, logs — survives redeploys.
      - dfc-storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "8080"
    # Plain Docker only (not Coolify): uncomment to reach the site on port 8080.
    # ports:
    #   - "8080:8080"

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-dfc_logistics_front}"
      MYSQL_USER: "${DB_USERNAME:-dfc}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}"
      TZ: Asia/Kolkata
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - dfc-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  dfc-storage:
  dfc-mysql:
