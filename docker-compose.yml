# =============================================================
# DFC Chocolate Store — app + MySQL
# Coolify: use the "Docker Compose" build pack; fill the variables
#          in the Environment Variables tab (required ones are marked).
# Plain Docker: docker compose --env-file .env.production up -d --build
# =============================================================
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_NAME: "${APP_NAME:-Your Brand}"
      APP_ENV: local
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY:?Set APP_KEY (php artisan key:generate --show)}"
      APP_URL: "${APP_URL:?Set APP_URL, e.g. https://yourdomain.com}"
      APP_TIMEZONE: Asia/Kolkata
      APP_LOCALE: en
      APP_FALLBACK_LOCALE: en
      APP_FAKER_LOCALE: en_IN
      APP_MAINTENANCE_DRIVER: file

      BCRYPT_ROUNDS: "12"

      LOG_CHANNEL: stderr
      LOG_STACK: single
      LOG_DEPRECATIONS_CHANNEL: "null"
      LOG_LEVEL: "${LOG_LEVEL:-info}"

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE:-dfc_chocolate_store}"
      DB_USERNAME: "${DB_USERNAME:-dfc}"
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD}"

      SESSION_DRIVER: file
      SESSION_LIFETIME: "240"
      SESSION_ENCRYPT: "false"
      SESSION_PATH: /
      SESSION_DOMAIN: "${SESSION_DOMAIN:-null}"
      SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-true}"
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: local
      BROADCAST_CONNECTION: log

      MAIL_MAILER: "${MAIL_MAILER:-log}"
      MAIL_SCHEME: "${MAIL_SCHEME:-smtps}"
      MAIL_HOST: "${MAIL_HOST:-smtp.hostinger.com}"
      MAIL_PORT: "${MAIL_PORT:-465}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-hello@example.com}"
      MAIL_FROM_NAME: "${APP_NAME:-Your Brand}"

      # Store bootstrap values (used only when seeding a fresh install;
      # afterwards edit them in Admin → Company setup).
      BRAND_NAME: "${BRAND_NAME:-Your Brand}"
      BUSINESS_PHONE: "${BUSINESS_PHONE:-+91 90000 00000}"
      BUSINESS_WHATSAPP: "${BUSINESS_WHATSAPP:-919000000000}"
      BUSINESS_EMAIL: "${BUSINESS_EMAIL:-hello@example.com}"

      ADMIN_NAME: "${ADMIN_NAME:-Store Owner}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@example.com}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set a strong ADMIN_PASSWORD}"
      ADMIN_PATH: "${ADMIN_PATH:-admin}"

      PRODUCTS_PER_PAGE: "${PRODUCTS_PER_PAGE:-12}"

      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
      SEED_ADMIN: "${SEED_ADMIN:-true}"
    volumes:
      # Product images / uploads, sessions, cache, logs — survives redeploys.
      - dfc-store-storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "8080"
    # Plain Docker only (not Coolify): uncomment to reach the site on port 8080.
    # ports:
    #   - "8080:8080"

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-dfc_chocolate_store}"
      MYSQL_USER: "${DB_USERNAME:-dfc}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}"
      TZ: Asia/Kolkata
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - dfc-store-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  dfc-store-storage:
  dfc-store-mysql:
