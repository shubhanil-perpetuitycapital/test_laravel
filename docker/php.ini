; Production PHP settings
expose_php = Off
memory_limit = 256M
max_execution_time = 60
; Matches nginx client_max_body_size (25M) + investor PDF cap (20M, see
; InvestorDocumentRequest). A 2GB cap was a memory-exhaustion / DoS vector:
; a single large multipart upload could pin a worker's RAM.
upload_max_filesize = 25M
post_max_size = 28M
max_file_uploads = 20
date.timezone = Asia/Kolkata
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Hide version banner and guard against path-traversal via null bytes.
cgi.fix_pathinfo = 0

opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Code never changes inside a running container.
opcache.validate_timestamps = 0
